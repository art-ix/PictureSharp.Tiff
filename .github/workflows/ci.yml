name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  managed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - run: dotnet test -c Release
      - run: dotnet pack src/PictureSharp.Tiff -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  aot:
    # The plugin trimmed and compiled ahead of time must decode the corpus exactly as the JIT tests do. Trimming
    # warnings and reflection gaps do not depend on the OS, so Linux is enough.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish tests/AotConsumer -c Release -o artifacts/aot
      - run: artifacts/aot/AotConsumer tests/assets/corpus tests/assets/reference.json
